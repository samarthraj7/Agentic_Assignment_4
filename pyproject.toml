[project]
name = "experimentmesh"
version = "0.1.0"
description = "Agentic ML experiment mesh across teammates' machines (CSCI 599 A4 capstone)"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.3.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "websockets==17.4",
    "pydantic==2.14.4",
    "docker==7.2.0",
    "cryptography==50.0.2",
    "psutil==7.2.2",
    "google-cloud-firestore==2.34.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["shared*", "node*", "hub*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
